[project]
name = "autogeo"
version = "0.1.0"
description = "PyTorch + timm EfficientNet-B1 pipeline for Dunham texture classification on carbonate cores."
authors = [
    { name = "E. Baraboshkin", email = "baraboshkin@petroleum.digital" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = ["carbonate", "dunham", "geology", "deep-learning", "efficientnet"]

dependencies = [
    "torch>=2.1,<3.0",
    "torchvision>=0.16,<1.0",
    "timm>=0.9,<2.0",
    "albumentations>=1.3,<2.0",
    "opencv-python-headless>=4.8,<5.0",
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.13,<1.0",
    "pyyaml>=6.0,<7.0",
    "tqdm>=4.65,<5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.8",
    "pytest>=8.0",
]

[project.scripts]
autogeo-train = "autogeo.cli:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
