name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Python syntax + package metadata + YAML configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python syntax
        run: |
          python -c '
          import ast, glob, sys
          files = [f for f in glob.glob("**/*.py", recursive=True) if ".venv" not in f]
          errors = []
          for f in files:
              try:
                  ast.parse(open(f, encoding="utf-8").read(), filename=f)
              except SyntaxError as e:
                  errors.append(f"{f}: {e}")
          if errors:
              for e in errors:
                  print("FAIL", e)
              sys.exit(1)
          print(f"OK: {len(files)} Python files parsed")
          '

      - name: Verify pyproject.toml validity
        run: |
          python -c '
          import tomllib, glob, sys
          files = list(glob.glob("**/pyproject.toml", recursive=True))
          for f in files:
              with open(f, "rb") as fh:
                  tomllib.load(fh)
              print(f"OK: {f}")
          if not files:
              sys.exit("no pyproject.toml found")
          '

      - name: Verify YAML configs
        run: |
          python -c '
          import yaml, glob
          for f in glob.glob("**/*.yaml", recursive=True):
              with open(f, encoding="utf-8") as fh:
                  yaml.safe_load(fh)
              print(f"OK: {f}")
          '

      - name: Smoke-check autogeo 7-class config
        run: |
          python -c '
          import yaml
          cfg = yaml.safe_load(open("autogeo/configs/7cls.yaml", encoding="utf-8"))
          assert "classes" in cfg and len(cfg["classes"]) >= 3
          n = len(cfg["classes"])
          print(f"OK: autogeo 7cls config has {n} classes")
          '
